<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cash Curry Staff</title>
  <style>
    :root { --bg: #f5f7f6; --fg: #0b1f1a; --muted: #5b6b66; --brand: #0b4d40; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b1412; --fg: #e8f0ed; --muted: #93a39e; --brand: #3fbf9b; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px; text-align: center; }
    .mark { width: 64px; height: 64px; border-radius: 18px; background: var(--brand); margin: 0 auto 20px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: var(--muted); font-size: 15px; line-height: 1.5; margin: 0 0 24px; }
    button { background: var(--brand); color: #fff; border: 0; border-radius: 14px; padding: 14px 28px; font-size: 16px; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1>No connection</h1>
    <p>Cash Curry needs the internet.<br />Check your Wi-Fi or mobile data, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
